name: Build Notia APK (release)

on:
  push:
    branches: [mobile-app]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # Optional: sign with your own key. Without these secrets the bundled key is used
      # (the same one the old Expo build used, so the APK installs over it).
      - name: Prepare signing key
        env:
          KS_B64: ${{ secrets.NOTIA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/notia-release.jks"
            echo "NOTIA_KEYSTORE_FILE=$RUNNER_TEMP/notia-release.jks" >> "$GITHUB_ENV"
            echo "Using the release key from repository secrets."
          else
            echo "No release key secret found: using the bundled key."
          fi

      - name: Build release APK
        env:
          NOTIA_KEYSTORE_PASSWORD: ${{ secrets.NOTIA_KEYSTORE_PASSWORD }}
          NOTIA_KEY_ALIAS: ${{ secrets.NOTIA_KEY_ALIAS }}
          NOTIA_KEY_PASSWORD: ${{ secrets.NOTIA_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify and name the APK
        id: apk
        run: |
          SRC=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$SRC" | head -5
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          NAME="Notia-${VERSION}-build${GITHUB_RUN_NUMBER}.apk"
          cp "$SRC" "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "### $NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "Size: $(du -h "$NAME" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Notia-release-apk
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: Notia Android build ${{ github.run_number }}
          body: Release APK built from `${{ github.sha }}`. Install it on Android 7.0 or newer.
          files: ${{ steps.apk.outputs.name }}
