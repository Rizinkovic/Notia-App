<!doctype html><html><head><meta charset="utf-8"><title>Notia</title><link rel="stylesheet" href="style.css"></head><body>
<aside><div class="brand"><img src="icon.svg" alt="">Notia</div>
<nav><button data-tab="notes"><span>📝</span> <span data-i="notes"></span></button><button data-tab="tasks"><span>✅</span> <span data-i="tasks"></span></button><button data-tab="lib"><span>📚</span> <span data-i="lib"></span></button></nav>
<div id="cats"></div><button id="addcat" data-i="newcat"></button>
<div class="foot"><button id="theme" title="Theme">◐</button><button id="lang"></button><button data-e="tour" title="Tutorial">❓</button><button id="about" title="About">ⓘ</button></div></aside>
<main id="notes"><section id="list"><input id="q"><button id="new" class="pri" data-i="newnote"></button><div id="items"></div></section>
<section id="pane"><div class="bar"><button data-c="bold"><b>B</b></button><button data-c="italic"><i>I</i></button><button data-c="underline"><u>U</u></button><button data-c="hl">▮</button><button data-c="mono" class="mono">{ }</button>
<select id="font"><option>Segoe UI</option><option>Georgia</option><option>Arial</option><option>Consolas</option><option>Comic Sans MS</option></select>
<button data-c="sm">A−</button><button data-c="lg">A+</button><button data-c="img">🖼</button><button data-c="print">🖨</button>
<select id="exp"><option value="">⭳ Export</option><option>docx</option><option>pdf</option><option>md</option><option>txt</option></select><button data-e="share">📤</button><button data-c="del">🗑</button><input id="file" type="file" accept="image/*" hidden></div>
<div class="bar" id="bar2"><button data-e="h1">H1</button><button data-e="h2">H2</button><button data-e="p">¶</button><button data-e="ul">•</button><button data-e="ol">1.</button><button data-e="check">☐</button><button data-e="quote">❝</button><button data-e="left">⇤</button><button data-e="center">↔</button><button data-e="right">⇥</button><button data-e="link">🔗</button><button data-e="strike"><s>S</s></button><button data-e="table">▦</button><button data-e="hr">—</button><input id="col" type="color" value="#4f46e5" title="Color"><button data-e="undo">↶</button><button data-e="redo">↷</button><button data-e="clear">⌧</button><span id="wc"></span></div>
<input id="ttl"><div id="ed" contenteditable="true" spellcheck="true"></div></section></main>
<main id="tasks" hidden><form id="tf"><input id="nt" required><input id="nd" type="datetime-local"><button class="pri" data-i="add"></button><button type="button" id="vl" data-tv="list" data-i="list"></button><button type="button" id="vm" data-tv="month" data-i="month"></button></form><div id="tl"></div></main>
<main id="lib" hidden><div id="shelf"></div><div id="viewer" hidden><div id="vbar"><button data-v="back" data-i="back"></button><button data-v="prev">◀</button><input id="pn" type="number" min="1"><span id="pt"></span><button data-v="next">▶</button><button data-v="zout">−</button><button data-v="zin">+</button><button data-v="fit">↔</button></div><div id="pg"><canvas id="cv"></canvas></div></div></main>
<dialog id="dlg"></dialog><div id="toast"></div><script src="app.js"></script><script src="extra.js"></script></body></html>
