# Gradle performance and AndroidX
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true

# Build only for modern Android phones. Use ARCHS to override for emulators.
reactNativeArchitectures=arm64-v8a

# React Native runtime
newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=true

# Release optimization (keeps the app's JavaScript and native features).
android.enableMinifyInReleaseBuilds=true
android.enableShrinkResourcesInReleaseBuilds=true
android.enablePngCrunchInReleaseBuilds=true

# Keep image formats supported by the app.
expo.gif.enabled=true
expo.webp.enabled=true
expo.webp.animated=false

# Compress native libraries inside sideload APKs.
expo.useLegacyPackaging=true

# Avoid AGP 9 DSL migration changes until the project explicitly opts in.
android.builtInKotlin=false
android.newDsl=false

# Give slow networks more time during first dependency resolution.
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000
org.gradle.internal.repository.max.retries=5
org.gradle.internal.repository.initial.backoff=2000
